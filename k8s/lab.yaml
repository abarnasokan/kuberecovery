apiVersion: v1
kind: Namespace
metadata:
  name: kuberecovery-demo
  labels:
    app.kubernetes.io/part-of: kuberecovery
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-app
  namespace: kuberecovery-demo
spec:
  replicas: 2
  revisionHistoryLimit: 5
  progressDeadlineSeconds: 90
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: sample-app
  template:
    metadata:
      labels:
        app: sample-app
    spec:
      automountServiceAccountToken: false
      containers:
        - name: web
          image: nginx:1.28-alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 3
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: sample-app
  namespace: kuberecovery-demo
spec:
  selector:
    app: sample-app
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kuberecovery
  namespace: kuberecovery-demo
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kuberecovery
  namespace: kuberecovery-demo
rules:
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [sample-app]
    verbs: [get, patch]
  - apiGroups: [apps]
    resources: [replicasets]
    verbs: [get, list]
  - apiGroups: ['']
    resources: [pods, events]
    verbs: [get, list]
  - apiGroups: ['']
    resources: [pods/log]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kuberecovery
  namespace: kuberecovery-demo
subjects:
  - kind: ServiceAccount
    name: kuberecovery
    namespace: kuberecovery-demo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kuberecovery
